  <!-- JAVASCRIPT: MAGNETIC TABS, LIVE CLOCK & THEME SWITCHER -->
  <!-- ======================================================== -->
  <script>
    // 1. Sliding Magnetic Indicator
    const navContainer = document.getElementById('navContainer');
    const indicator = document.getElementById('navIndicator');
    const tabs = navContainer ? navContainer.querySelectorAll('.tab-btn') : [];

    tabs.forEach(tab => {
      tab.addEventListener('mouseenter', () => {
        const rect = tab.getBoundingClientRect();
        const parentRect = navContainer.getBoundingClientRect();
        indicator.style.opacity = '1';
        indicator.style.width = `${rect.width}px`;
        indicator.style.transform = `translateX(${rect.left - parentRect.left}px)`;
      });

      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('font-semibold', 'text-neutral-950', 'dark:text-white'));
        tab.classList.add('font-semibold', 'text-neutral-950', 'dark:text-white');
      });
    });

    if (navContainer) {
      navContainer.addEventListener('mouseleave', () => {
        indicator.style.opacity = '0';
      });
    }

    // 2. Real-Time Dubai Ticking Clock (DXB GMT+4)
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Dubai', hour: '2-digit', minute: '2-digit', hour12: true };
      const timeStr = now.toLocaleTimeString('en-US', options);
      const clockEl = document.getElementById('liveClock');
      const mobileClockEl = document.getElementById('mobileLiveClock');
      if (clockEl) clockEl.textContent = `DXB ${timeStr}`;
      if (mobileClockEl) mobileClockEl.textContent = timeStr;
    }
    updateClock();
    setInterval(updateClock, 30000);

    // 3. Theme Toggle
    const html = document.documentElement;
    const body = document.body;
    const themeBtn = document.getElementById('themeToggleBtn');

    themeBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      body.style.backgroundColor = isDark ? '#000000' : '#ffffff';

      themeBtn.style.transform = 'rotate(180deg)';
      setTimeout(() => {
        themeBtn.style.transform = 'none';
      }, 300);
    });

    // 4. Mobile Menu Toggle
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const mobileDropdown = document.getElementById('mobileDropdown');
    const hLine1 = document.getElementById('hLine1');
    const hLine2 = document.getElementById('hLine2');
    const hLine3 = document.getElementById('hLine3');

    if (mobileBtn && mobileDropdown) {
      mobileBtn.addEventListener('click', () => {
        mobileDropdown.classList.toggle('hidden');
        mobileDropdown.classList.toggle('flex');
        const isOpen = !mobileDropdown.classList.contains('hidden');
        if (isOpen) {
          hLine1.setAttribute('transform', 'rotate(45 12 12) translate(0, 5)');
          hLine2.style.opacity = '0';
          hLine3.setAttribute('transform', 'rotate(-45 12 12) translate(0, -5)');
        } else {
          hLine1.removeAttribute('transform');
          hLine2.style.opacity = '1';
          hLine3.removeAttribute('transform');
        }
      });
    }
  </script>
